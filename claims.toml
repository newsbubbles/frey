[[claim]]
id = "operating.production"
claim = "Frey has been run in production."
stated_in = ["README.md:17-18"]
status = "retracted"
would_settle = """
It has not, by anyone, including its author. Three demonstration projects and thousands of live
sessions in one simulation are more than nothing and much less than operating experience.

The honest deliverable is not the word "production". It is replacing the README status line with a
paragraph precise enough that a staff-level reader can check every number in it — and this table
standing behind it, with a third of its rows still saying UNEVIDENCED.
"""

[[claim]]
id = "operating.unattended"
claim = "Frey runs unattended without a person watching it."
status = "declared-only"
would_settle = """
Thirty consecutive nights of deadnet's existing night loop on a scheduled task, with the durability
substrate in place, and `notes/INCIDENTS.md` recording every failure with a `found_by` field.

The tripwire is the number that matters: **if by day 21 no incident has been found by the system
rather than by somebody reading code, the instrument is dead rather than the system healthy.** The
history makes zero incidents in three weeks implausible — a 145-tool-call runaway found by reading
an invoice, a model going 4/5 to 0/5 within an hour on unchanged code, four provider errors in one
night.
"""

