claim = "A recorded run can be replayed through the ordinary agent loop."
status = "settled"
settled_by = "test:a_recorded_run_replays_through_the_ordinary_agent_loop"

[[claim]]
id = "operating.replay-of-an-old-journal"
claim = "A journal recorded before content hashing existed replays with its prompts compared."
status = "retracted"
would_settle = """
It cannot: the hash was not written down. Such a journal replays for *shape* and reports
`Divergence::Unknown`, which is logged rather than treated as a match — the honest answer being that
the prompts were not compared, not that they agreed.
"""

[[claim]]
id = "perf.per-turn-overhead-is-measured"
claim = "Frey reports what the framework itself cost on every turn, separated from the provider wait and the caller's tools."
stated_in = ["docs/performance.md", "docs/why-frey.md"]
status = "settled"
settled_by = "test:every_turn_reports_where_its_time_went"
would_settle = """
`EventKind::TurnFinished` carries a `TurnTiming` on **every** turn, tool turns included, into the
journal and the trace. `frey timings <journal>` reads it back.

The design decision worth defending: `overhead_us` is `total - provider - tools`, computed by
subtraction rather than by summing the instrumented phases, so loop time nobody put a clock on
shows up as a gap instead of disappearing. Pinned by
`time_nobody_instrumented_shows_up_rather_than_disappearing`.
"""

[[claim]]
id = "perf.overhead-is-small-on-a-minimal-prompt"
claim = "Frey's steady-state per-turn overhead is roughly 12 microseconds."
stated_in = ["docs/performance.md"]
status = "tested-only"
settled_by = "test:many_agents_share_one_adapter_and_keep_their_records_apart"
would_settle = """
Median of 1,024 concurrent runs, release build, one user message and no tools —
`cargo run --release -p frey --example concurrency`.

**This row said 282 µs for about an hour**, which was one turn in a cold process and roughly 95%
first-run cost. See I-013. The first turn really does cost ~280 µs and that is reported separately
rather than averaged away.

Still `tested-only`, because the prompt is the smallest one possible. `build_segments` walks every
tool definition and every turn, and assembly clones the request, so both dominant phases scale with
prompt size. A 200-tool catalog over a 50-turn history is the case that matters and is unmeasured.
Quoting 12 µs as the number for a real agent would be quoting the easiest case.
"""

[[claim]]
id = "perf.median-does-not-degrade-under-concurrency"
claim = "Frey's per-turn overhead does not degrade from 1 to 1,024 concurrent agents sharing one adapter."
stated_in = ["docs/performance.md", "docs/why-frey.md"]
status = "tested-only"
settled_by = "test:many_agents_share_one_adapter_and_keep_their_records_apart"
would_settle = """
Median overhead is 11-18 µs from 64 agents up to 1,024, against a shared `Arc<SharedModel>`. It does
not rise. The named test pins the correctness half — 64 agents, one adapter, distinct journals,
phase breakdown still a breakdown — and the example measures the performance half.

**The p99 is a different answer and is not claimed here.** It runs 40-60x the median and moves
between repeats. The medians holding flat suggests scheduler jitter rather than lock contention, but
that is an inference from two numbers, not a measurement, and characterising it needs a histogram
nobody has built.

Not `settled` because the provider is a fake that sleeps. Nothing here touches a socket, a TLS
session, an HTTP/2 stream limit or a rate limiter, and a real fleet meets all four. This claim is
about the framework and cannot be read as a claim about a deployment.
"""

[[claim]]
id = "perf.concurrency-against-a-real-provider"
claim = "Frey handles many concurrent agents against a real provider without degrading."
status = "declared-only"
would_settle = """
The design is there and untested. `complete` takes `&self`, `Arc<P>` implements `ModelProvider`
(fixed in 0.2.0 — the documented pattern did not compile), and `HttpProvider::with_client` exists
so a fleet shares one connection pool rather than exhausting sockets.

None of that is measured. No load test, no contention measurement, no figure for what happens at
100 or 10,000 concurrent runs. The external reviewer whose workload is ~35,000 sessions a day is
the reason the affordances exist, and their absence from this table is the honest state.
"""
