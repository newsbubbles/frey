[[claim]]
id = "a2a.transport"
claim = "Agent-to-agent interoperability is first class."
stated_in = ["README.md#protocols"]
status = "retracted"
would_settle = """
`frey-a2a` is types and a lifecycle with no client, no server and no transport. The README now says
so. The convergence argument — that MCP elicitation, A2A auth challenges and AG-UI frontend tools
are one shape — is real and is what made the MCP approval handshake a dozen lines; "first class" was
