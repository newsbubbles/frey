## What this repository says about itself, and what stands behind each claim.
##
## Checked on every push by `cargo xtask claims`. The check is on the *evidence*, not on the file:
## a `test:` row must resolve to a test that still exists under that name, and a `results:` row must
## resolve to a dated record inside its own staleness window. A checker that verified paths existed
## would go green forever while every claim underneath it decayed.
##
## Status ladder, weakest to strongest:
##
##   retracted     — claimed, wrong, withdrawn. Kept, because a retraction that is deleted is a
##                   retraction nobody can check.
##   declared-only — a type, a trait or a document exists and nothing produces it. Published as
##                   UNEVIDENCED. This is the honest state of about a third of the ladder's rungs
##                   and the reason the table is worth having.
##   tested-only   — tests pass and nothing has run it in anger.
##   settled       — a named test proves it and CI runs that test.
##   operated      — a running system has demonstrated it, with a timestamped record that expires.
##
## `operated` is the only status this project cannot yet award itself. That is the whole point of
## the evidence programme in `notes/plan/EVIDENCE-PLAN.md`, and every row below that could become
## `operated` says what would do it.

