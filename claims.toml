[[claim]]
id = "approval.input-is-recorded"
claim = "Input supplied from outside a run is recorded in the journal, so a replay can reproduce it."
status = "declared-only"
acknowledges_orphan = "Effect::InputSupplied"
would_settle = """
The **third** half of the approval machinery, and the reason `claims.toml` said "both halves exist"
when there are three. `Effect::InputSupplied` is the record a replay would read a human's answer
back from — declared, serialised, round-tripped by the journal tests, and never constructed, because
nothing in the loop can ask for input in the first place.

Found by widening the producer lint's swept list to include `Effect`. It was omitted on the first
pass, which is the same partial application of the method that let `Warning::RouteChanged` survive
the audit whose whole purpose was finding this shape. Twice now.

Settled by the same handler hook as `approval.in-the-loop`: an approval that is answered and then
replayed to the same answer.
"""

