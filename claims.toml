[[claim]]
id = "catalog.progressive-disclosure"
claim = "Tool search, skills and code-mode are three presentations of one disclosed catalog."
stated_in = ["README.md#limitations", "notes/audit/01-capability-audit.md"]
status = "declared-only"
acknowledges_orphan = "EventKind::Discovered"
would_settle = """
The machinery is real and tested; `Agent::run` takes a fixed tool list once per run and calls none
of it. Settling it needs one disclosure path end to end, producing `Item::Discovery` and
`EventKind::Discovered` on a runtime path.

Deliberately not scheduled. deadnet's Decision 37 declines progressive disclosure *by name* — "a
fixed tool block is the cacheable shape" — which makes the only real caller evidence *against* it
for high-volume short-session work. Half the stated wedge stays a design document, labelled here.
"""

[[claim]]
id = "catalog.discovery-item"
claim = "A discovered tool enters the prompt as its own item, after the cache breakpoint."
status = "declared-only"
acknowledges_orphan = "Item::Discovery"
would_settle = "The same disclosure path as `catalog.progressive-disclosure`."

[[claim]]
id = "codemode.local-execution"
claim = "Code mode can run a script without delegating to a provider."
stated_in = ["README.md#limitations"]
status = "retracted"
would_settle = """
`Strategy::Local` has nothing behind it and will until an engine is embedded. abacus established
this is more limiting than first stated: a model handed a bespoke restricted grammar invents the
`filter` and `first` that grammar ought to have, so a small executor of your own is not a
substitute. Delegation is the only working path and the README says so.
"""

