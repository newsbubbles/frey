[workspace]
resolver = "3"
members = [
    "crates/frey",
    "crates/frey-a2a",
    "crates/frey-cli",
    "crates/frey-agent",
    "crates/frey-context",
    "crates/frey-core",
    "crates/frey-harness",
    "crates/frey-macros",
    "crates/frey-mcp",
    "crates/frey-providers",
    "crates/frey-sandbox",
    "crates/frey-testkit",
    "crates/frey-tools",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/newsbubbles/frey"
authors = ["Nate Gibson"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
smol_str = { version = "0.3", features = ["serde"] }
futures-core = "0.3"
dynosaur = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
