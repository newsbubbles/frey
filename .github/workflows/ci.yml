name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # trybuild's expected output is compiler-version sensitive, so the UI suite runs on one
      # platform rather than failing three ways for the same reason.
      - run: cargo test --workspace
        if: matrix.os == 'ubuntu-latest'
      - run: cargo test --workspace -- --skip forbidden_flows_do_not_compile
        if: matrix.os != 'ubuntu-latest'

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The optional features have to build alone as well as together: someone will turn off
      # exactly the one we never tested without.
      - run: cargo check -p frey --no-default-features
      - run: cargo check -p frey --no-default-features --features mcp
      - run: cargo check -p frey --no-default-features --features sandbox
      - run: cargo check -p frey --no-default-features --features a2a
      - run: cargo check -p frey --features full

  examples:
    name: examples and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Examples in a README that no longer compile are worse than no examples.
      - run: cargo run -p frey --example cache_planning
      - run: cargo run -p frey --example agent_loop
      - run: cargo run -p frey-cli -- profiles
      - run: cargo doc --workspace --no-deps

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
