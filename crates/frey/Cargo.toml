[package]
name = "frey"
description = "A Rust agent framework where the context window is a managed resource: MCP-native tooling, provider-aware prompt caching, capability-scoped execution, and deterministic replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["agent", "llm", "mcp", "ai", "framework"]
categories = ["development-tools", "api-bindings"]
readme = "../../README.md"

[dependencies]
frey-core = { path = "../frey-core", version = "0.1.1" }
frey-agent = { path = "../frey-agent", version = "0.1.1" }
frey-context = { path = "../frey-context", version = "0.1.1" }
frey-tools = { path = "../frey-tools", version = "0.1.1" }
frey-providers = { path = "../frey-providers", version = "0.1.1", default-features = false }
frey-sandbox = { path = "../frey-sandbox", version = "0.1.1", optional = true }
frey-mcp = { path = "../frey-mcp", version = "0.1.1", optional = true }
frey-a2a = { path = "../frey-a2a", version = "0.1.1", optional = true }
frey-harness = { path = "../frey-harness", version = "0.1.1", optional = true }

[features]
default = ["http", "mcp", "sandbox", "harness"]
# Real HTTP providers. Off, the wire mapping remains and can be tested without a network.
http = ["frey-providers/http"]
# Model Context Protocol client.
mcp = ["dep:frey-mcp"]
# Cross-platform process confinement.
sandbox = ["dep:frey-sandbox"]
# Agent-to-agent interoperability.
a2a = ["dep:frey-a2a"]
# Sessions, approvals, AG-UI, and `doctor`.
harness = ["dep:frey-harness"]
# Everything.
full = ["http", "mcp", "sandbox", "a2a", "harness"]

[dev-dependencies]
frey-testkit = { path = "../frey-testkit", version = "0.1.1" }
pollster = "0.4"
serde_json.workspace = true
# The live provider examples need a real reactor. `HttpProvider` is built on `reqwest`, which is
# built on Tokio, so `pollster::block_on` is fine for the scripted model and not for the network.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
