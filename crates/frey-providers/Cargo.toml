[package]
name = "frey-providers"
description = "Provider adapters for the Frey agent framework: Anthropic, OpenAI Responses, OpenRouter, and config-defined dialects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
frey-core = { path = "../frey-core", version = "0.2.1" }
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
thiserror.workspace = true
futures-core.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["http"]
# The real HTTP transport. Turning it off leaves the wire mapping, which is what the tests exercise.
http = ["dep:reqwest", "dep:tokio", "dep:bytes"]
# Delegating to a vendor agent CLI. No HTTP client: the credential stays with their binary.
agent-cli = ["dep:tokio", "tokio/process", "tokio/io-util", "tokio/rt"]

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
frey-testkit = { path = "../frey-testkit", version = "0.2.1" }
# For the cross-check between the two tables of vendor constants. A dev-dependency only: the
# adapters must not read their capabilities from the profiles crate, or the two tables become one
# and the check becomes a tautology.
frey-context = { path = "../frey-context", version = "0.2.1" }

[lints]
workspace = true
